name: Design harness

# Fails a pull request on harness errors. Doesn't write to the log: people
# commit log changes with their work.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/harness.mjs check --no-write
